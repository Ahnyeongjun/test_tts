<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>내 목소리 TTS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 40px 16px;
      background: #0f0f13;
      font-family: 'Segoe UI', sans-serif;
      color: #e8e8f0;
    }

    .card {
      background: #1a1a24;
      border: 1px solid #2a2a38;
      border-radius: 16px;
      padding: 36px 40px;
      width: 560px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.4);
    }

    .header { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
    h1 { font-size: 20px; font-weight: 600; color: #c4b5fd; }
    .subtitle { font-size: 12px; color: #5050a0; }

    /* ── tabs ── */
    .tabs { display: flex; gap: 0; border-bottom: 1px solid #2a2a38; }
    .tab {
      padding: 8px 20px;
      font-size: 14px;
      font-weight: 500;
      color: #7070a0;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: color 0.15s, border-color 0.15s;
    }
    .tab.active { color: #c4b5fd; border-bottom-color: #7c5cfc; }
    .tab-panel { display: none; flex-direction: column; gap: 16px; }
    .tab-panel.active { display: flex; }

    /* ── form elements ── */
    label { font-size: 13px; color: #9090b0; margin-bottom: 5px; display: block; }
    .field { display: flex; flex-direction: column; }

    select, textarea, input[type=range] {
      background: #12121c;
      border: 1px solid #2a2a3a;
      border-radius: 8px;
      color: #e8e8f0;
      padding: 10px 12px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
      width: 100%;
    }
    select:focus, textarea:focus { border-color: #7c5cfc; }
    textarea { resize: vertical; min-height: 110px; line-height: 1.6; }
    input[type=range] { padding: 4px 0; cursor: pointer; }

    .row { display: flex; align-items: center; gap: 10px; }
    .row label { margin: 0; white-space: nowrap; }

    /* ── upload area ── */
    .upload-area {
      border: 1px dashed #3a3a50;
      border-radius: 8px;
      padding: 18px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .upload-area:hover { border-color: #7c5cfc; background: #1e1e2e; }
    .upload-area input { display: none; }
    .upload-area .icon { font-size: 26px; margin-bottom: 4px; }
    .upload-area p { font-size: 13px; color: #7070a0; }

    /* ── file list ── */
    .file-list { display: flex; flex-direction: column; gap: 6px; max-height: 180px; overflow-y: auto; }
    .file-item {
      display: flex; align-items: center; gap: 8px;
      background: #12121c; border: 1px solid #2a2a3a;
      border-radius: 6px; padding: 6px 10px; font-size: 13px;
    }
    .file-item input[type=checkbox] { accent-color: #7c5cfc; width: 15px; height: 15px; flex-shrink: 0; }
    .file-item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    .file-item .del-btn {
      background: none; border: none; color: #5050a0; font-size: 15px;
      cursor: pointer; padding: 0 4px; line-height: 1; flex-shrink: 0;
      transition: color 0.15s;
    }
    .file-item .del-btn:hover { color: #f87171; }

    /* ── buttons ── */
    button {
      background: #7c5cfc;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 11px 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    button:hover { background: #6a4de0; }
    button:active { transform: scale(0.98); }
    button:disabled { background: #3a3a50; cursor: not-allowed; }

    /* ── status / result ── */
    .status { font-size: 13px; color: #7070a0; text-align: center; min-height: 18px; }
    .status.error { color: #f87171; }
    .status.success { color: #6ee7b7; }
    .status.warn { color: #fbbf24; }

    audio { width: 100%; border-radius: 8px; }
    .result { display: flex; flex-direction: column; gap: 10px; }
    .dl-btn {
      background: #1e1e2e;
      border: 1px solid #2a2a3a;
      color: #c4b5fd;
      font-size: 13px;
      padding: 8px 12px;
      text-align: center;
      border-radius: 8px;
      text-decoration: none;
      transition: background 0.2s;
    }
    .dl-btn:hover { background: #2a2a3a; }

    /* ── model badge ── */
    .badge {
      display: inline-block;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 20px;
      font-weight: 600;
    }
    .badge.ready  { background: #065f46; color: #6ee7b7; }
    .badge.loading { background: #1e3a5f; color: #93c5fd; }
    .badge.error  { background: #3a1e1e; color: #f87171; }

    .spinner {
      display: inline-block;
      width: 13px; height: 13px;
      border: 2px solid #ffffff44;
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 5px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .hint { font-size: 12px; color: #5050a0; margin-top: 4px; }
    hr { border: none; border-top: 1px solid #2a2a38; }
    .speed-val { font-size: 13px; color: #9090b0; min-width: 32px; text-align: right; }
  </style>
</head>
<body>
<div class="card">
  <div class="header">
    <h1>🎙️ 내 목소리 TTS</h1>
    <span class="subtitle">XTTS v2 · zero-shot 목소리 복제</span>
    <span id="modelBadge" class="badge loading">로딩 중...</span>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('generate')">음성 생성</div>
    <div class="tab" onclick="switchTab('voices')">🎤 참조 오디오</div>
  </div>

  <!-- ═══════════════ 생성 탭 ═══════════════ -->
  <div id="tab-generate" class="tab-panel active">

    <div class="field">
      <label>변환할 텍스트</label>
      <textarea id="textInput" placeholder="여기에 읽어줄 텍스트를 입력하세요..."></textarea>
    </div>

    <div class="field">
      <label>참조 오디오 <span style="color:#5050a0">(내 목소리 샘플 — 복수 선택 가능)</span></label>
      <div class="file-list" id="refList">
        <div style="font-size:13px;color:#5050a0;text-align:center;padding:10px">
          참조 오디오 없음 — 오디오 탭에서 업로드하세요
        </div>
      </div>
    </div>

    <div class="row" style="gap:12px">
      <label style="margin:0;white-space:nowrap">속도</label>
      <input type="range" id="speed" min="0.5" max="2.0" step="0.05" value="1.0"
             oninput="document.getElementById('speedVal').textContent = parseFloat(this.value).toFixed(2)" />
      <span id="speedVal" class="speed-val">1.00</span>
    </div>

    <button id="generateBtn" onclick="generate()">음성 생성하기</button>
    <div class="status" id="genStatus"></div>

    <div class="result" id="result" style="display:none">
      <audio id="audioPlayer" controls></audio>
      <a id="downloadLink" class="dl-btn" download>⬇️ 다운로드</a>
    </div>
  </div>

  <!-- ═══════════════ 참조 오디오 탭 ═══════════════ -->
  <div id="tab-voices" class="tab-panel">

    <p style="font-size:13px;color:#9090b0;line-height:1.7">
      목소리 복제에 사용할 내 목소리 샘플을 업로드하세요.<br/>
      <strong style="color:#c4b5fd">6초 이상</strong> 권장 · 여러 파일을 선택하면 더 정확해요 · 조용한 환경 녹음 권장
    </p>

    <div class="upload-area" onclick="document.getElementById('voiceFile').click()">
      <div class="icon">🎤</div>
      <strong>파일 선택 (여러 개 가능)</strong>
      <p>wav · mp3 · flac · m4a</p>
      <input type="file" id="voiceFile" accept=".wav,.mp3,.flac,.m4a" multiple onchange="handleUpload()" />
    </div>

    <div class="file-list" id="voiceList">
      <div style="font-size:13px;color:#5050a0;text-align:center;padding:10px">업로드된 파일이 없어요</div>
    </div>

    <div class="status" id="voiceStatus"></div>
  </div>
</div>

<script>
  // ── 탭 전환 ──
  function switchTab(name) {
    document.querySelectorAll('.tab').forEach((t, i) => {
      t.classList.toggle('active', ['generate', 'voices'][i] === name);
    });
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    document.getElementById('tab-' + name).classList.add('active');
    if (name === 'voices') refreshVoiceList();
    if (name === 'generate') refreshRefList();
  }

  // ── 모델 상태 폴링 ──
  async function pollModelStatus() {
    try {
      const res = await fetch('/model-status');
      const data = await res.json();
      const badge = document.getElementById('modelBadge');

      if (data.status === 'ready') {
        badge.textContent = '준비 완료';
        badge.className = 'badge ready';
        document.getElementById('generateBtn').disabled = false;
      } else if (data.status === 'error') {
        badge.textContent = '오류';
        badge.className = 'badge error';
        badge.title = data.message;
      } else {
        badge.textContent = '로딩 중...';
        badge.className = 'badge loading';
        document.getElementById('generateBtn').disabled = true;
        setTimeout(pollModelStatus, 3000);
      }
    } catch {
      setTimeout(pollModelStatus, 5000);
    }
  }

  // ── 참조 오디오 목록 (생성 탭) ──
  async function refreshRefList() {
    const res = await fetch('/voices');
    const data = await res.json();
    const el = document.getElementById('refList');
    if (!data.voices.length) {
      el.innerHTML = '<div style="font-size:13px;color:#5050a0;text-align:center;padding:10px">참조 오디오 없음 — 오디오 탭에서 업로드하세요</div>';
      return;
    }
    el.innerHTML = data.voices.map(v => `
      <label class="file-item">
        <input type="checkbox" class="ref-file" value="${v}" checked />
        <span title="${v}">${v}</span>
      </label>`).join('');
  }

  // ── 참조 오디오 목록 (오디오 탭) ──
  async function refreshVoiceList() {
    const res = await fetch('/voices');
    const data = await res.json();
    const el = document.getElementById('voiceList');
    if (!data.voices.length) {
      el.innerHTML = '<div style="font-size:13px;color:#5050a0;text-align:center;padding:10px">업로드된 파일이 없어요</div>';
      return;
    }
    el.innerHTML = data.voices.map(v => `
      <div class="file-item">
        <span title="${v}">${v}</span>
        <button class="del-btn" onclick="deleteVoice('${v}')" title="삭제">✕</button>
      </div>`).join('');
  }

  // ── 업로드 ──
  async function handleUpload() {
    const files = document.getElementById('voiceFile').files;
    if (!files.length) return;
    setStatus('voiceStatus', '업로드 중...', '');
    for (const file of files) {
      const form = new FormData();
      form.append('file', file);
      const res = await fetch('/upload-voice', { method: 'POST', body: form });
      if (!res.ok) {
        const e = await res.json();
        setStatus('voiceStatus', e.detail || '업로드 실패', 'error');
        return;
      }
    }
    setStatus('voiceStatus', `${files.length}개 업로드 완료!`, 'success');
    refreshVoiceList();
    refreshRefList();
  }

  // ── 삭제 ──
  async function deleteVoice(filename) {
    const res = await fetch(`/voices/${encodeURIComponent(filename)}`, { method: 'DELETE' });
    if (res.ok) {
      refreshVoiceList();
      refreshRefList();
    } else {
      const e = await res.json();
      setStatus('voiceStatus', e.detail || '삭제 실패', 'error');
    }
  }

  // ── 음성 생성 ──
  async function generate() {
    const text = document.getElementById('textInput').value.trim();
    if (!text) return setStatus('genStatus', '텍스트를 입력해주세요.', 'error');

    const refs = [...document.querySelectorAll('.ref-file:checked')].map(c => c.value);
    if (!refs.length) return setStatus('genStatus', '참조 오디오를 하나 이상 선택해주세요.', 'error');

    const btn = document.getElementById('generateBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>생성 중...';
    document.getElementById('result').style.display = 'none';
    setStatus('genStatus', 'XTTS v2 추론 중...', '');

    const form = new FormData();
    form.append('text', text);
    form.append('ref_audios', JSON.stringify(refs));
    form.append('speed', document.getElementById('speed').value);

    try {
      const res = await fetch('/generate', { method: 'POST', body: form });
      if (!res.ok) {
        const e = await res.json();
        throw new Error(e.detail || '생성 실패');
      }
      const data = await res.json();
      const url = `/download/${data.output}`;
      document.getElementById('audioPlayer').src = url;
      document.getElementById('downloadLink').href = url;
      document.getElementById('downloadLink').download = data.output;
      document.getElementById('result').style.display = 'flex';
      setStatus('genStatus', '완료!', 'success');
    } catch (e) {
      setStatus('genStatus', e.message, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = '음성 생성하기';
      pollModelStatus(); // 상태 재확인
    }
  }

  function setStatus(id, msg, type) {
    const el = document.getElementById(id);
    el.textContent = msg;
    el.className = 'status ' + (type || '');
  }

  // 초기화
  pollModelStatus();
  refreshRefList();
</script>
</body>
</html>
