services:
  tts:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./voices:/app/voices      # 참조 오디오 샘플
      - ./outputs:/app/outputs    # 생성된 음성 파일
    shm_size: '2gb'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
